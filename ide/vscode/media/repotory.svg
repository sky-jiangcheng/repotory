<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Activity-bar icon: build/icon.svg (brand SSOT) verbatim, inside a 24
       viewBox — the same printed card as the marketplace icon.
       Generated by scripts/generate-icons.mjs; do not edit by hand. -->
  <g transform="scale(0.046875)">

  <title>Repotory</title>

  <!-- Single source of truth for the Repotory brand mark — ONE master,
       every surface: the app iconset (iconset, Wails appicon, Windows
       .ico), the browser favicons, the VS Code marketplace + activity-bar
       icons, the JetBrains tool-window icon, the docs sidebar mark
       (build-docs.mjs inlines this file), the README banners, and the app
       UI's BrandMark component. Change this file, run
       scripts/generate-icons.mjs, rebuild the docs — every surface shows
       the new mark. The CI sync gate (check mode) fails on any stale
       derivative, so a rebrand can never ship half-applied.

       Why one master again: the brand briefly ran two — a navy app tile
       (this file) and an editorial paper card (build/plugin-icon.svg) for
       the stores. Two files holding one letterform is exactly the drift
       that shipped half-applied rebrands three releases running — the
       activity bar, the tool window, the favicons and the README banner
       each missed a move while its twin moved. The paper card won on
       merit anyway: in store lists and at 13px it reads as a printed
       object, where the navy tile read as one more blue square. So the
       card became the brand and the second file was deleted.

       Design: warm-paper field #F5F0E4 + hairline frame #1B1B1B (9 units
       on the 512 grid, inset 26) + near-black ink #1B1B1B. The frame is
       what makes the card look printed rather than drawn; without it the
       cream square has no edge. No gradient, no shadow, no rounded
       corners — the square edge and the hairline are the style.

       Letterform: the R from IBM Plex Sans Bold (© IBM Corp., SIL OFL
       1.1), outlined, scaled to a 320-unit cap height. Centred on visual
       mass, not on the bounding box: an R is heavier on its stem side, so
       the glyph sits 6 units right and 2 up of dead centre. Typeface
       proportions are already corrected by a type designer; the brand
       owns the field, colour and application.
       Process: outputs/icon-redesign-v4. -->

  <rect width="512" height="512" fill="#F5F0E4"/>
  <rect x="26" y="26" width="460" height="460" fill="none" stroke="#1B1B1B" stroke-width="9"/>
  <g transform="translate(21.06 13.06) scale(0.941176)">
    <path fill="#1B1B1B" fill-rule="nonzero" d="M195.6 426H121.56V86H282.79Q306.17 86 325.17 93.79Q344.17 101.59 357.56 115.96Q370.96 130.33 378.26 150.3Q385.57 170.27 385.57 194.62Q385.57 229.21 370.23 255.03Q354.88 280.84 323.71 292.53L390.44 426H308.12L248.69 301.3H195.6ZM273.54 238.95Q290.1 238.95 299.6 230.43Q309.09 221.9 309.09 205.34V183.91Q309.09 167.35 299.6 158.82Q290.1 150.3 273.54 150.3H195.6V238.95Z"/>
  </g>

  </g>
</svg>
