<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Repotory">
  <title>Repotory</title>

  <!-- Single source of truth for the APP-side brand mark — the navy tile
       the OS shows (iconset, Wails appicon, Windows .ico). Generated into
       derivatives by scripts/generate-icons.mjs.

       The store / web / docs side of the brand lives in the editorial
       paper-card master build/plugin-icon.svg: browser favicons, the
       VS Code marketplace + activity-bar icons, the JetBrains icons, the
       docs sidebar mark and the README banners all derive from it. The
       favicons used to be derived from THIS file — that split is what let
       the rebrand ship half-applied, so the two domains now each own one
       master and the CI sync gate watches both. -->

       Field: one flat ink (#0F2244). No gradient, no inner bevel — both read
       as stock app-icon chrome at 16px and cheapen the mark at 512px.

       Letterform: the R from IBM Plex Sans Bold (© IBM Corp., SIL OFL 1.1),
       outlined, scaled to a 320-unit cap height. Centred on visual mass, not
       on the bounding box: an R is heavier on its stem side, so the glyph sits
       6 units right and 2 up of dead centre. Typeface proportions are already
       corrected by a type designer; the brand owns the field, colour and
       application. Process: outputs/icon-redesign-v4. -->
  <rect width="512" height="512" rx="116" fill="#0F2244"/>
  <g transform="translate(21.06 13.06) scale(0.941176)">
    <path fill="#F6F8FC" fill-rule="nonzero" d="M195.6 426H121.56V86H282.79Q306.17 86 325.17 93.79Q344.17 101.59 357.56 115.96Q370.96 130.33 378.26 150.3Q385.57 170.27 385.57 194.62Q385.57 229.21 370.23 255.03Q354.88 280.84 323.71 292.53L390.44 426H308.12L248.69 301.3H195.6ZM273.54 238.95Q290.1 238.95 299.6 230.43Q309.09 221.9 309.09 205.34V183.91Q309.09 167.35 299.6 158.82Q290.1 150.3 273.54 150.3H195.6V238.95Z"/>
  </g>
</svg>
