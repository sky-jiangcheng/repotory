# CI test gate / CI 测试门禁
#
# Rationale / 背景: release.yml only runs on tags and pages.yml only runs on
# docs/** changes, so neither of them executes a single test. This workflow is
# the gate: every push to master and every pull request (any branch) must pass
# both the Go suite and the web suite before it can land.
#
# 两个 job 互相独立、可并行；失败时 GitHub UI 上能一眼看出是 Go 挂了还是前端挂了。
# 完整桌面应用构建（含 macOS 签名/公证）仍然由 release.yml 负责，本文件不碰它。
name: CI

on:
  push:
    branches:
      - master
  pull_request:
  # Manual re-run for debugging a red main branch.
  workflow_dispatch:

# 同一分支上的重复推送 / PR 更新只保留最新一次运行，旧的在跑的任务会被取消。
# 防止 force-push 连打时排队堆积，也让 required check 的结果保持新鲜。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The gate only needs to read the repo. Least privilege, and it keeps the
# token from being usable as a write credential inside untrusted PR code.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- Go ----
  # Why a matrix and not just ubuntu: v2.14.0 shipped a red main branch because
  # a test hardcoded `darwin/arm64` — the code compiled fine, it just asserted a
  # fact about the machine it was written on. A single-OS gate cannot see that
  # class of defect, and this product ships installers for all three platforms.
  #
  # `fail-fast: false` on purpose: when two platforms break for different
  # reasons we want both lists in one run, not one at a time.
  go-test:
    name: Go build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            race: '-race'
          - os: macos-latest
            race: '-race'
          # No -race on Windows: the detector needs cgo and a working gcc, and
          # the windows runner's mingw toolchain turns every run into a slow,
          # occasionally-flaky build for a signal the two Unix rows already
          # give us. Windows is here for the platform-specific runtime paths
          # (file modes, path separators, case sensitivity), not for races.
          - os: windows-latest
            race: ''
    # The stub step below is a POSIX shell one-liner; make every run step use
    # bash so it reads the same on Windows.
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # go.mod declares `go 1.26.0`; setup-go resolves the newest 1.26.x.
          go-version: '1.26'
          # Cache GOMODCACHE keyed on go.sum, so unchanged deps are not
          # re-downloaded on every run.
          cache: true

      # main.go:21 has `//go:embed all:web/dist`, but web/dist is a build
      # artifact and is .gitignore'd — a fresh checkout has no web/dist at all,
      # so the root package fails to compile with
      # "pattern all:web/dist: no matching files found".
      # We only need the embed pattern to *resolve*; no JavaScript is linked
      # into the test binaries, so a one-line placeholder is enough. An empty
      # directory would NOT work — go:embed requires at least one matching file.
      # The real assets are produced by the web-test job / release.yml.
      - name: Stub web/dist for the embed directive
        run: mkdir -p web/dist && printf '<!doctype html>\n' > web/dist/index.html

      # Compile-only pass: catches type errors and broken imports across every
      # package (including main) without running anything. Fails fast and is
      # much faster than discovering the same error via `go test`.
      #
      # NOTE: no GTK/WebKit system packages are installed here, and none are needed.
      # internal/db uses modernc.org/sqlite (pure Go, zero CGO) and the service
      # layer tests drive a fake git provider. internal/app does import
      # github.com/wailsapp/wails/v2/pkg/runtime, but that package compiles and
      # links on a stock ubuntu-latest image — verified with `go build .` on plain
      # Linux. The GTK/WebKit dev headers are only required by `wails build` in
      # release.yml, which this gate does not run.
      - name: Build all packages
        run: go build ./...

      # Full test suite: every Go test file across service/db/knowledge/
      # scanner/diff/httpapi/...
      #
      # No file count here on purpose: a hardcoded number went stale within
      # weeks and had to be corrected by hand, which is exactly the drift
      # TODO.md 3.1 tracks. The suite is "all of them" — there is no subset
      # to keep in sync.
      #
      # `-race` is on because the service layer fans out goroutines during scans
      # and knowledge indexing; without it a data race that only shows up under CI
      # parallelism ships silently. The caveat: the race detector needs cgo and a
      # C toolchain. On the Unix rows that is the stock image's compiler; the
      # Windows row runs without it (see the matrix comment above).
      - name: Run Go tests
        run: go test ${{ matrix.race }} -timeout 15m ./...

  # ---------------------------------------------------------------- Vet ----
  # `go test` runs a subset of `go vet`'s checks (the ones that affect
  # correctness of the test run); the rest — printf verbs, unreachable code,
  # lost cancel funcs, struct tag mistakes — only run under an explicit vet.
  # Kept as its own job so a vet finding reads as "vet" in the checks list
  # instead of hiding inside a red test matrix.
  go-vet:
    name: Go vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'
          cache: true

      # Same reason as in go-test: the root package's `//go:embed all:web/dist`
      # does not resolve in a fresh checkout.
      - name: Stub web/dist for the embed directive
        run: mkdir -p web/dist && printf '<!doctype html>\n' > web/dist/index.html

      - name: Run go vet
        run: go vet ./...

  # ------------------------------------------------------- Vulnerabilities ----
  # A dependency can be safe the day it is added and vulnerable a year later
  # with no commit in this repository. govulncheck answers a narrower question
  # than a CVE list does: it reports only vulnerabilities in code this repo
  # actually *reaches*, which is what makes it usable as a gate rather than a
  # wall of advisories.
  #
  # Pinned on purpose (the same discipline as the action SHAs above): `@latest`
  # would let a new release change the verdict of a push that changed nothing.
  # Bump this line deliberately when you want the newer database/analysis.
  #
  # What a red result usually means: a standard-library advisory whose fix is
  # in a NEWER PATCH of the same minor Go version. `go-version: '1.26'` resolves
  # the newest 1.26.x, so the job heals itself on the next runner update; if it
  # stays red, the fix is a Go patch bump, not a code change. Module findings
  # (the ones this repository can actually fix) are the other, rarer case.
  govulncheck:
    name: Vulnerability scan (govulncheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'
          cache: true

      - name: Stub web/dist for the embed directive
        run: mkdir -p web/dist && printf '<!doctype html>\n' > web/dist/index.html

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Run govulncheck
        run: govulncheck ./...

  # ------------------------------------------------------------ Format ----
  # gofmt is the one tool every Go developer already runs before committing,
  # yet the repo had no gate for it — and 11 files had drifted out of format
  # (struct field alignment, mainly) without anyone noticing. Nothing breaks
  # at runtime when a file is unformatted, so the drift accumulates silently
  # until somebody runs gofmt -w over the tree and produces a 44-line diff
  # that has nothing to do with the change it claims to be.
  #
  # The gate is a plain `gofmt -l`: it prints the offending files and exits
  # non-zero, so the diff in CI is exactly the list to fix. No formatting is
  # applied automatically — a bot that rewrites source would make the
  # offending commit look innocent.
  gofmt:
    name: Go formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'

      - name: Check gofmt
        run: |
          set -euo pipefail
          BAD=$(gofmt -l internal cmd)
          if [ -n "$BAD" ]; then
            echo "ERROR: these files are not gofmt-clean:" >&2
            echo "$BAD" >&2
            echo >&2
            echo "Fix with: gofmt -w \$(gofmt -l internal cmd)" >&2
            exit 1
          fi
          echo "gofmt clean"

  # ------------------------------------------------------------ Packaging ----
  # The Homebrew tap and the Scoop bucket are published from packaging/ in this
  # repository, so these manifests are shipped artifacts and need the same
  # treatment as any other: a defect in them must fail HERE, not in a user's
  # terminal after a release.
  #
  # Two real defects were sitting in packaging/ unnoticed until the tap
  # actually received the files on 2026-10-26:
  #
  #   - the casks carried a `license "MIT"` stanza, which is a FORMULA method;
  #     `brew install --cask` rejects the whole definition with
  #     "undefined method 'license' for Cask".
  #   - the Scoop alias manifests carried `#` comment lines, which JSON cannot
  #     parse — the bucket's CI rejected them as malformed.
  #
  # Both are cheap to check on Linux (no Homebrew needed), so they are checked
  # here, before scripts/sync-packaging.sh pushes anything.
  packaging-manifests:
    name: Package manager manifests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check the manifests
        run: ./scripts/check-packaging-manifests.sh

  # ------------------------------------------------------------ 版本漂移 ----
  # The version and a few counts are stated in a dozen places. They used to be
  # kept in sync by hand, and the hand-sync did not survive: TODO.md still said
  # v2.18.0 after v2.19.0 shipped, SECURITY.md promised weekly Dependabot
  # scans while dependabot.yml ran monthly, AGENTS.md counted "33 ADRs" that
  # stopped being 33 the moment the next one landed. "Remember to update it"
  # does not survive two release rounds.
  #
  # So the rule here is: derived facts are derived (this job recomputes them
  # from the source of truth instead of comparing two hand-written copies),
  # facts that cannot be derived are not written down (AGENTS.md and
  # SECURITY.md now point at the source instead of repeating it), and whatever
  # is left is a hard gate. scripts/bump-version.sh now moves TODO.md's version
  # line together with the manifests, and this job fails if it did not.
  version-drift:
    name: Version & count drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'

      - name: Check version & count drift
        run: node scripts/check-version-drift.mjs

  # ------------------------------------------------------------- Icons ----
  # The brand mark lives once (build/icon.svg); every shipped icon — the
  # Wails appicon, the Windows .ico, the VS Code extension icon and the docs
  # favicons — is generated from it. This job fails when somebody edits the
  # mark (or any derivative) without running scripts/generate-icons.mjs, so
  # a rebrand can never land half-applied. Pixel comparison with a small
  # allowance keeps it stable across sharp patch releases.
  #
  # ORDER MATTERS. The committed derivatives are checked FIRST, against the
  # SSOT, before anything is generated: generating first would overwrite the
  # committed files and the following --check would compare the generator
  # with itself, catching nothing at all. The gitignored intermediates
  # (build/icons/*, build/appicon.png) do not exist in a fresh checkout, so
  # they are verified only after they have been generated.
  icon-check:
    name: Icon derivatives in sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'

      - name: Install sharp
        run: npm install --no-save sharp

      # The real gate: every COMMITTED derivative must match what the
      # generator produces from build/icon.svg right now.
      - name: Verify committed icon derivatives match build/icon.svg
        run: node scripts/generate-icons.mjs --check --tracked-only

      - name: Generate icon intermediates
        run: node scripts/generate-icons.mjs

      - name: Verify all icon derivatives match build/icon.svg
        run: node scripts/generate-icons.mjs --check

  # ------------------------------------------------- Docs mirror ----
  # The bilingual manual (docs/**/*.md 中文源 ↔ docs/en/**/*.md 英文源) must stay
  # 1:1. A half-migration ("只改一边") historically let the English site describe a
  # product architecture that did not exist — that is exactly what this gate
  # turns into a hard failure. Pure node, zero deps, no build: it just diffs the
  # two .md trees and (for intentionally-Chinese-only research docs) checks them
  # against the whitelist inside the script.
  docs-mirror:
    name: Docs ZH/EN 1:1 mirror
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'

      - name: Check ZH/EN mirror
        run: node scripts/check-docs-mirror.mjs

  # A single-brace `{count}` in a locale value is invisible to tsc, eslint and
  # every unit test: i18next treats it as plain text and renders the placeholder
  # itself ("待整理 {count}"). Three of them shipped at once in the 2026-10-21
  # UI sweep and none was caught by anything but looking at the screen, so the
  # check is mechanical now. Same shape as docs-mirror: pure node, zero deps.
  i18n-interpolation:
    name: Locale interpolation syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'

      - name: Check interpolation syntax
        run: node scripts/check-i18n-interpolation.mjs

  # A missing translation is invisible to tsc, eslint and every unit test: i18next
  # returns the key itself, so the UI shows "home.thinking" — or, worse, the call
  # site's `defaultValue` (usually Chinese) quietly takes over and the English
  # interface looks half-translated rather than broken. The 2026-10-25 frontend
  # audit found 7 keys missing from BOTH locales exactly that way. The check is
  # mechanical now: every statically referenced key must exist in every locale, the
  # locales must not drift apart, a plural variant needs its base key, and the
  # English locale may not keep Chinese text. Same shape as i18n-interpolation:
  # pure node, zero deps.
  i18n-keys:
    name: Locale key coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'

      - name: Check key coverage
        run: node scripts/check-i18n-keys.mjs

  # The WorkBuddy skill package ships in the release, so three of its failure
  # modes would reach users without any other job noticing: a malformed
  # frontmatter stops the skill from being discovered at all, a stale schema
  # column kills the query script on the user's machine, and a layout change
  # makes the loader reject the package. The check builds a throwaway SQLite
  # database and runs every subcommand against it — it never touches the real
  # knowledge base (CI has none anyway).
  skill-package:
    name: WorkBuddy skill package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'

      - name: Check skill package
        run: node scripts/check-skill-package.mjs

  # The desktop app and the CLI both wire Repotory's MCP server into the
  # user's AI clients, and they are two implementations of ONE wire format:
  # the desktop app is a self-contained binary with no node, the CLI is a node
  # script. Two implementations of one format drift silently — the button says
  # "registered", the CLI says "registered", and Claude Code sees nothing —
  # so both sides are pinned to one golden fixture
  # (internal/agentinit/testdata/contract.json). This job runs the node side;
  # the Go side is pinned by TestContractFixture in internal/agentinit.
  agent-init-contract:
    name: AI client wiring contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'

      # Runs the wiring script inside a temp directory; the user's real client
      # configuration is never touched.
      - name: Check the wiring script against the shared contract fixture
        run: node scripts/check-agent-init-contract.mjs

  # ---------------------------------------------------------- dsh plugin ----
  # dsh-plugin-repotory is a third client surface (after the desktop app and the
  # MCP server) and had no gate at all: no lockfile, a `"*"` dependency that
  # floats onto whatever `latest` happens to be, and no job that compiled it.
  # A type error in src/index.ts, or a dependency bump that changed defineTool's
  # signature, would have sat on master until somebody ran `dsh web` by hand.
  #
  # `npm ci` + `tsc --noEmit` is the whole gate: the plugin ships no build step
  # because dsh loads `src/index.ts` directly (package.json `main`), so there is
  # no bundle to produce — only the question "does this file still type-check
  # against the APIs it calls". `npm ci` (not `install`) doubles as the lockfile
  # check: it fails when package-lock.json has drifted from package.json.
  dsh-plugin-test:
    name: dsh plugin typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dsh-plugin-repotory
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: npm
          # The plugin has its own lockfile; the default lookup would key on the
          # repo root one instead.
          cache-dependency-path: dsh-plugin-repotory/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  # ------------------------------------------------------------- Docker ----
  # The Dockerfile is the NAS/homelab delivery path (ADR-0025 Docker tier) and
  # nothing had ever built it: release.yml does not, and there is no image job
  # anywhere in the repo. `web/package.json`'s `build:server` script (which the
  # image calls), the `cmd/server` path, and the web-dist directory it copies
  # were all unchecked — a rename in either would surface only in a user's
  # terminal.
  #
  # Build, never publish. Publishing needs a registry the maintainer has to
  # choose and credentials to push with; a build that nobody pushed still
  # answers the question this job exists to answer ("does the Dockerfile still
  # describe this repo?").
  #
  # No runtime smoke (`docker run` + /health) on purpose: the container's data
  # directory is a user-mounted volume, so what a smoke test would really assert
  # is Docker's volume ownership, not this repo's code — and a gate that fails
  # for reasons outside the repo teaches people to ignore it.
  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build the headless-server image
        run: docker build --progress=plain --tag repotory-server:ci .

  # --------------------------------------------------------------- Web ----
  web-test:
    name: Web typecheck, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        # The frontend package lives in web/, and the real lockfile is
        # web/package-lock.json (180KB). The repo root also carries an 87-byte
        # leftover package-lock.json, so every step must be pinned to web/ or it
        # would install from / resolve against the wrong manifest.
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # web deps require Node >= 20.19; the bare '20' major resolves to the
          # newest 20.x, which satisfies that. Matches release.yml / pages.yml.
          node-version: '20'
          # npm cache keyed on web/package-lock.json. cache-dependency-path is
          # required because the default lookup stops at the repo root and
          # would key on the stray 87-byte root lockfile instead.
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `npm ci` (not `npm install`) so the job fails loudly when
      # web/package-lock.json is out of sync with web/package.json instead of
      # silently rewriting the lockfile.
      - name: Install dependencies
        run: npm ci

      # 10 vitest files under web/src/**. The vite.config.ts `test` block
      # supplies the jsdom environment, so no extra setup step is required.
      - name: Run unit tests (vitest)
        run: npm test

      # `tsc && vite build`. tsconfig.json is strict, with noUnusedLocals and
      # noUnusedParameters on, so this step is the real TypeScript gate.
      - name: Typecheck and build (tsc && vite build)
        run: npm run build

      # eslint over src/**. The local release gate has always been
      # `npm test && npm run build && npm run lint` (AGENTS.md), but CI stopped
      # at build — so a lint regression could sit on master between releases
      # and then surface as a release-gate failure at tagging time.
      - name: Lint (eslint)
        run: npm run lint

  # --------------------------------------------------------- VS Code ext ----
  # release.yml compiles the extension, but only on tags — so a TypeScript
  # breakage in ide/vscode could sit on master unnoticed until the next release.
  # This job is the gate. It also re-runs scripts/sync-init.mjs and fails when
  # the bundled repotory-init copy has drifted from its source of truth: the
  # command reads it at runtime, so a stale copy silently ships an old installer.
  vscode-extension-test:
    name: VS Code extension compile & bundle sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ide/vscode
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ide/vscode/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `tsc -p ./ && node scripts/sync-init.mjs`. tsconfig.json is strict, so
      # this is the extension's TypeScript gate; the sync step copies
      # scripts/repotory-init/index.mjs next to the build output.
      - name: Compile
        run: npm run compile

      # `compile` rewrites the copy, so a difference now means the file was
      # committed out of sync with ../../scripts/repotory-init/index.mjs.
      - name: Bundled repotory-init is in sync
        run: git diff --exit-code -- repotory-init/index.mjs

  # ------------------------------------------------------ JetBrains plugin ----
  # Same reasoning as the VS Code job above: release.yml does not build the
  # JetBrains plugin at all, so a Kotlin compile error in ide/jetbrains could
  # sit on master indefinitely — the only gate was somebody running
  # `gradle buildPlugin` by hand. This job is that gate.
  #
  # It builds, it does not verify: `verifyPlugin` downloads a full IDE (about
  # 1.2 GB) on top of the platform distribution this build already needs, and
  # the job's job is to keep master compiling. Run `gradle verifyPlugin` locally
  # for the compatibility check against the declared sinceBuild/untilBuild.
  jetbrains-plugin-test:
    name: JetBrains plugin build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        # The plugin is its own Gradle build; without this every step would run
        # from the repo root, where there is no build script.
        working-directory: ide/jetbrains
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # jvmToolchain(21) in build.gradle.kts means the build needs a JDK 21; the
      # toolchain is also what makes "compiled with Kotlin 2.2.0" match the
      # platform's own metadata (an older Kotlin aborts with "Module was compiled
      # with an incompatible version of Kotlin").
      - name: Setup JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      # This repository ships no Gradle wrapper in ide/jetbrains/, so the
      # gradle-version input is what makes Gradle exist at all: the action
      # downloads and caches the distribution (and, unlike a bare
      # actions/cache on ~/.gradle, it also caches the Gradle User Home, which
      # is where the 1.2 GB IntelliJ Platform distribution lands — that cache is
      # the difference between a 3-minute job and a 9-minute one).
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Quotes are required or YAML reads 8.10.2 as a number.
          gradle-version: '8.10.2'

      # Compiles the Kotlin sources against the real IntelliJ Platform and packs
      # build/distributions/repotory-jetbrains-<version>.zip. This is the actual
      # gate: it fails on a Kotlin type error, an unresolved platform API, or a
      # plugin.xml that references a class that does not exist.
      - name: Build plugin (gradle buildPlugin)
        run: gradle buildPlugin
